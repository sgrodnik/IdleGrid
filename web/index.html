<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdleGrid</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --border-color: #000000;
            --fill-color: #333333;
            --grid-line: #eeeeee;
            --cell-w: 12px;
            --cell-h: 25px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            margin: 20px;
            font-size: 12px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button {
            border: 1px solid var(--border-color);
            background: white;
            padding: 5px 15px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #f0f0f0; }

        .grid-wrapper {
            position: relative;
            display: inline-block;
        }

        .grid-container {
            display: inline-grid;
            grid-template-columns: 40px repeat(60, var(--cell-w));
            gap: 0;
            border-top: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
        }
        .hour-label {
            grid-column: 1;
            height: calc(var(--h-mult, 1) * var(--cell-h));
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            background: #fdfdfd;
            cursor: help;
            white-space: nowrap;
            overflow: hidden;
        }
        .minute-block {
            width: var(--cell-w);
            height: calc(var(--h-mult, 1) * var(--cell-h));
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            position: relative;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
        }
        .fill {
            width: 100%;
            background: var(--fill-color);
            transition: opacity 0.1s;
        }
        @keyframes pulse-white {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }
        .fill.highlight {
            z-index: 10;
            animation: pulse-white 0.8s ease-in-out infinite alternate;
            position: relative;
        }
        .minute-block.current {
            background: #ffffff;
            position: relative;
        }
        .minute-block.current svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .minute-block.current path {
            fill: #aaa;
        }
        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 15px;
            height: 15px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, black 50%, black 60%, transparent 60%, transparent 70%, black 70%);
            border-right: 1px solid black;
            border-bottom: 1px solid black;
        }
        .tooltip {
            position: fixed;
            background: black;
            color: white;
            padding: 8px;
            border: 1px solid white;
            z-index: 1000;
            display: none;
            pointer-events: none;
            max-width: 300px;
            white-space: pre-line;
        }

        /* Bottom Layout */
        .bottom-sections {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            margin-top: 10px;
        }
        .legend-container, .stats-container {
            margin-top: 10px;
        }
        .legend-container h3, .stats-container h3 {
            margin-bottom: 5px;
            font-size: 13px;
            border-bottom: 1px solid #000;
            padding-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #legendTable, #statsTable {
            border-collapse: collapse;
            font-size: 11px;
            width: auto;
        }
        #legendTable th, #legendTable td,
        #statsTable th, #statsTable td {
            text-align: left;
            padding: 3px 10px;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }
        #legendTable td:nth-child(2) {
            white-space: normal;
            word-break: break-all;
            max-width: 400px;
        }
        #legendTable tr:hover {
            background: #f9f9f9;
        }
        #legendTable tr.legend-highlight {
            background: #fff3cd;
        }
        .color-swatch {
            width: 12px;
            height: 12px;
            border: 1px solid #000;
            display: inline-block;
            vertical-align: middle;
        }

        /* Settings Modal */
        #settingsOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 2000;
            display: none;
            padding: 40px;
            box-sizing: border-box;
        }
        .settings-content {
            max-width: 500px;
            margin: 0 auto;
        }
        .settings-content textarea {
            width: 100%;
            height: 200px;
            font-family: 'Consolas', monospace;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="btnOpen">Open Log Folder</button>
        <button id="btnSettings">Settings</button>
        <span id="status"></span>
    </div>

    <div id="settingsOverlay">
        <div class="settings-content">
            <h3>Configuration</h3>
            <p>Edit values below (JSON format):</p>
            <textarea id="settingsText"></textarea>
            <div style="display: flex; gap: 10px;">
                <button id="btnSaveSettings">Save & Apply</button>
                <button id="btnResetSettings">Reset to Defaults</button>
                <button id="btnCloseSettings">Cancel</button>
            </div>
        </div>
    </div>

    <div class="grid-wrapper">
        <div id="grid" class="grid-container"></div>
        <div id="resizeHandle" class="resize-handle"></div>
    </div>

    <div class="bottom-sections">
        <div id="legend" class="legend-container">
            <h3>Today's Activities</h3>
            <table id="legendTable">
                <thead>
                    <tr>
                        <th>Color</th>
                        <th>Window Process</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="stats-container">
            <h3>Day Summary</h3>
            <table id="statsTable">
                <tbody>
                    <tr><th>Day Start</th><td id="statDayStart">-</td></tr>
                    <tr><th>Work Duration</th><td id="statWorkDayTotal">-</td></tr>
                    <tr><th>Total Active</th><td id="statTotalActive">-</td></tr>
                    <tr><th>Longest Streak</th><td id="statMaxStreak">-</td></tr>
                    <tr><th>Current Session</th><td id="statCurrentStreak">-</td></tr>
                    <tr><th>Longest Break</th><td id="statMaxBreak">-</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>
        const grid = document.getElementById('grid');
        const tooltip = document.getElementById('tooltip');
        let directoryHandle;
        let logsFolderHandle; // Handle for the actual 'logs' subfolder
        let data = {}; // date_hour_min -> { active, windows }
        let windowColors = {}; // windowName -> color (assigned by daily rank)

        const defaultConfig = {
            GAP_LIMIT: 5,         // minutes of inactivity to break a session
            ACTIVE_THRESHOLD: 5,  // seconds in a minute to consider it "work"
            WORK_START: 7,        // hour to start highlighting
            WORK_END: 19          // hour to end highlighting
        };

        let config = { ...defaultConfig };

        // Setup Resizing
        const root = document.querySelector(':root');
        const handle = document.getElementById('resizeHandle');

        const palette = [
            "#f9c74f",
            "#90be6d",
            "#f9844a",
            "#43aa8b",
            "#f8961e",
            "#577590",
            "#f94144",
            "#6627a1"
        ];

        function getColor(str) {
            return windowColors[str] || '#cccccc';
        }

        function updateSize(w, h) {
            root.style.setProperty('--cell-w', w + 'px');
            root.style.setProperty('--cell-h', h + 'px');
            localStorage.setItem('ig-w', w);
            localStorage.setItem('ig-h', h);
        }

        // Drag handle logic
        handle.onmousedown = (e) => {
            const startX = e.clientX;
            const startY = e.clientY;
            const startW = parseInt(getComputedStyle(root).getPropertyValue('--cell-w'));
            const startH = parseInt(getComputedStyle(root).getPropertyValue('--cell-h'));

            const onMove = (em) => {
                const nw = Math.max(2, startW + Math.round((em.clientX - startX) / 60));
                const nh = Math.max(5, startH + Math.round((em.clientY - startY) / 24));
                updateSize(nw, nh);
            };
            const onUp = () => {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
            };
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        };

        async function init() {
            // Restore size
            const sw = localStorage.getItem('ig-w') || 12;
            const sh = localStorage.getItem('ig-h') || 25;
            updateSize(sw, sh);

            // Restore config
            const savedConfig = localStorage.getItem('ig-config');
            if (savedConfig) {
                try { config = JSON.parse(savedConfig); } catch(e) {}
            }

            renderGrid();
            document.getElementById('btnOpen').onclick = openFolder;

            // Settings Logic
            const overlay = document.getElementById('settingsOverlay');
            const txt = document.getElementById('settingsText');

            document.getElementById('btnSettings').onclick = () => {
                txt.value = JSON.stringify(config, null, 4);
                overlay.style.display = 'block';
            };
            document.getElementById('btnResetSettings').onclick = () => {
                txt.value = JSON.stringify(defaultConfig, null, 4);
            };
            document.getElementById('btnCloseSettings').onclick = () => overlay.style.display = 'none';
            document.getElementById('btnSaveSettings').onclick = () => {
                try {
                    config = JSON.parse(txt.value);
                    localStorage.setItem('ig-config', JSON.stringify(config));
                    overlay.style.display = 'none';
                    renderGrid();
                    if (logsFolderHandle) reloadData();
                } catch(e) {
                    alert("Invalid JSON format");
                }
            };

            // Sync reload with the start of the next minute
            const now = new Date();
            const delay = (60 - now.getSeconds()) * 1000 + 500; // Next minute + 0.5s buffer
            setTimeout(() => {
                reloadData();
                setInterval(reloadData, 60000);
            }, delay);

            // Smooth progress update for the current minute
            setInterval(updateProgress, 1000);
            updateProgress();
        }

        function updateProgress() {
            const now = new Date();
            const curH = now.getHours();
            const curM = now.getMinutes();
            const seconds = now.getSeconds();
            const progress = seconds / 60;

            document.querySelectorAll('.minute-block svg').forEach(s => {
                if (s.parentElement.id !== `m-${curH}-${curM}`) {
                    s.remove();
                }
            });

            const block = document.getElementById(`m-${curH}-${curM}`);
            if (block) {
                let svg = block.querySelector('svg');
                if (!svg) {
                    svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("viewBox", "0 0 100 100");
                    svg.setAttribute("preserveAspectRatio", "none");
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    svg.appendChild(path);
                    block.appendChild(svg);
                }
                const path = svg.querySelector('path');
                const angle = progress * 2 * Math.PI;
                const x = 50 + 100 * Math.sin(angle);
                const y = 50 - 100 * Math.cos(angle);
                const largeArc = progress > 0.5 ? 1 : 0;

                path.setAttribute("d", `M 50 50 L 50 -50 A 100 100 0 ${largeArc} 1 ${x} ${y} Z`);
            }
        }

        function renderGrid() {
            grid.innerHTML = '';
            for (let h = 0; h < 24; h++) {
                const isWorkHour = h >= config.WORK_START && h < config.WORK_END;
                const hMult = isWorkHour ? 1 : 0.5;

                const hourLabel = document.createElement('div');
                hourLabel.className = 'hour-label';
                hourLabel.style.setProperty('--h-mult', hMult);
                hourLabel.textContent = `${String(h).padStart(2, '0')}:00`;
                hourLabel.onmouseenter = (e) => showHourSummary(e, h);
                grid.appendChild(hourLabel);

                for (let m = 0; m < 60; m++) {
                    const minBlock = document.createElement('div');
                    minBlock.className = 'minute-block';
                    minBlock.style.setProperty('--h-mult', hMult);
                    minBlock.id = `m-${h}-${m}`;
                    minBlock.onmouseenter = (e) => showMinuteDetails(e, h, m);
                    minBlock.onmouseleave = () => tooltip.style.display = 'none';
                    const fill = document.createElement('div');
                    fill.className = 'fill';
                    minBlock.appendChild(fill);
                    grid.appendChild(minBlock);
                }
            }
        }

        async function openFolder() {
            try {
                directoryHandle = await window.showDirectoryPicker();

                // Try to find logs folder in common locations
                logsFolderHandle = null;

                async function findLogs(handle) {
                    // 1. Is it this folder?
                    try {
                        // Check if any .log file exists here to confirm
                        for await (const entry of handle.values()) {
                            if (entry.kind === 'file' && entry.name.endsWith('.log')) return handle;
                        }
                    } catch(e) {}

                    // 2. Is it in 'logs' subfolder?
                    try {
                        return await handle.getDirectoryHandle('logs');
                    } catch(e) {}

                    // 3. Is it in 'IdleGrid/logs'?
                    try {
                        const ig = await handle.getDirectoryHandle('IdleGrid');
                        return await ig.getDirectoryHandle('logs');
                    } catch(e) {}

                    return null;
                }

                logsFolderHandle = await findLogs(directoryHandle);

                if (!logsFolderHandle) {
                    // If nothing found, stick with the selected folder
                    logsFolderHandle = directoryHandle;
                }

                document.getElementById('status').textContent = ' Monitoring: ' + (logsFolderHandle === directoryHandle ? directoryHandle.name : '.../' + logsFolderHandle.name);
                await reloadData();
            } catch (err) {
                console.error(err);
            }
        }

        async function reloadData() {
            if (!logsFolderHandle) return;
            const now = new Date();
            const fileName = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}.log`;

            try {
                const fileHandle = await logsFolderHandle.getFileHandle(fileName);
                const file = await fileHandle.getFile();
                const text = await file.text();
                parseLogs(text);
                updateVisuals();
            } catch (e) {
                console.warn("Log file for today not found yet.");
            }
        }

        function parseLogs(text) {
            const lines = text.split('\n');
            data = {};
            const globalAgg = {}; // To rank most active windows for color assignment

            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length < 3) return;
                const time = parts[0]; // HH:mm
                const active = parseInt(parts[1]);
                const windows = JSON.parse(parts[2]);

                const [hStr, mStr] = time.split(':');
                const hour = parseInt(hStr);
                const min = parseInt(mStr);
                data[`${hour}-${min}`] = { active, windows };

                // Track global totals for the day
                for (const [win, sec] of Object.entries(windows)) {
                    globalAgg[win] = (globalAgg[win] || 0) + sec;
                }
            });

            // Assign colors based on total duration rank
            windowColors = {};
            const sorted = Object.entries(globalAgg).sort((a, b) => b[1] - a[1]);

            sorted.forEach(([win, sec], index) => {
                windowColors[win] = palette[index % palette.length];
            });

            updateLegend(sorted);
            analyzeSessions();
        }

        function analyzeSessions() {
            let sessions = [];
            let currentSession = null;
            let totalActiveSec = 0;

            const minutesWithData = Object.keys(data).map(k => {
                const [h, m] = k.split('-').map(Number);
                return { key: k, totalMin: h * 60 + m, active: data[k].active };
            }).sort((a, b) => a.totalMin - b.totalMin);

            minutesWithData.forEach(m => {
                totalActiveSec += m.active;
                if (m.active >= config.ACTIVE_THRESHOLD) {
                    if (!currentSession) {
                        currentSession = { start: m.totalMin, last: m.totalMin };
                    } else if (m.totalMin - currentSession.last > config.GAP_LIMIT) {
                        sessions.push(currentSession);
                        currentSession = { start: m.totalMin, last: m.totalMin };
                    } else {
                        currentSession.last = m.totalMin;
                    }
                }
            });
            if (currentSession) sessions.push(currentSession);

            const toTime = (totalMin) => `${String(Math.floor(totalMin/60)).padStart(2,'0')}:${String(totalMin%60).padStart(2,'0')}`;

            if (sessions.length > 0) {
                const startMin = sessions[0].start;
                const endMin = sessions[sessions.length - 1].last;

                // Day Start
                document.getElementById('statDayStart').textContent = toTime(startMin);

                // Work Day Duration (from first start to now/last activity)
                const now = new Date();
                const nowMin = now.getHours() * 60 + now.getMinutes();
                const duration = Math.max(0, nowMin - startMin);
                const durH = Math.floor(duration/60);
                const durM = duration % 60;
                document.getElementById('statWorkDayTotal').textContent = `${durH}h ${durM}m`;

                // Longest Streak
                let maxStreakIdx = 0;
                let maxStreakVal = 0;
                sessions.forEach((s, i) => {
                    const len = s.last - s.start + 1;
                    if (len > maxStreakVal) {
                        maxStreakVal = len;
                        maxStreakIdx = i;
                    }
                });
                const best = sessions[maxStreakIdx];
                document.getElementById('statMaxStreak').textContent = `${maxStreakVal}m (from ${toTime(best.start)})`;

                // Longest Break
                let maxBreak = 0;
                for (let i = 1; i < sessions.length; i++) {
                    const gap = sessions[i].start - sessions[i-1].last;
                    if (gap > maxBreak) maxBreak = gap;
                }
                document.getElementById('statMaxBreak').textContent = `${maxBreak}m`;

                // Current Session
                let currentStreakVal = 0;
                const lastSession = sessions[sessions.length - 1];
                if (nowMin - lastSession.last <= 10) {
                    currentStreakVal = nowMin - lastSession.start;
                }
                document.getElementById('statCurrentStreak').textContent = `${currentStreakVal}m`;
            }

            // Total Active (pure time)
            const totalHours = Math.floor(totalActiveSec / 3600);
            const totalMins = Math.floor((totalActiveSec % 3600) / 60);
            document.getElementById('statTotalActive').textContent = `${totalHours}h ${totalMins}m`;
        }

        function updateLegend(sortedData) {
            const tbody = document.querySelector('#legendTable tbody');
            tbody.innerHTML = '';

            sortedData.forEach(([name, sec]) => {
                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.dataset.window = name;
                tr.onmouseenter = () => highlightWindow(name);
                tr.onmouseleave = () => highlightWindow(null);

                const durMin = Math.round(sec / 60);
                const color = getColor(name);

                tr.innerHTML = `
                    <td><div class="color-swatch" style="background: ${color}"></div></td>
                    <td style="word-break: break-all;">${name}</td>
                    <td>${durMin} min</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateVisuals() {
            const now = new Date();
            const curH = now.getHours();
            const curM = now.getMinutes();

            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m++) {
                    const block = document.getElementById(`m-${h}-${m}`);
                    block.querySelectorAll('.fill').forEach(f => f.remove());

                    const entry = data[`${h}-${m}`];
                    if (entry) {
                        const sortedWindows = Object.entries(entry.windows)
                            .sort((a, b) => b[1] - a[1]);

                        const top3 = sortedWindows.slice(0, 3);
                        let totalShownSec = 0;

                        top3.forEach(([name, sec]) => {
                            const seg = document.createElement('div');
                            seg.className = 'fill';
                            seg.style.height = `${(sec / 60) * 100}%`;
                            seg.style.background = getColor(name);
                            seg.dataset.window = name;
                            seg.onmouseenter = (e) => {
                                e.stopPropagation();
                                highlightWindow(name);
                            };
                            seg.onmouseleave = () => highlightWindow(null);
                            block.appendChild(seg);
                            totalShownSec += sec;
                        });

                        const otherSec = entry.active - totalShownSec;
                        if (otherSec > 0) {
                            const seg = document.createElement('div');
                            seg.className = 'fill';
                            seg.style.height = `${(otherSec / 60) * 100}%`;
                            block.appendChild(seg);
                        }
                    }

                    if (h === curH && m === curM) {
                        block.classList.add('current');
                    } else {
                        block.classList.remove('current');
                    }
                }
            }
        }

        let currentHighlight = null;
        function highlightWindow(name) {
            if (name === currentHighlight) return;
            currentHighlight = name;

            document.querySelectorAll('.fill.highlight').forEach(el => el.classList.remove('highlight'));
            document.querySelectorAll('#legendTable tr.legend-highlight').forEach(el => el.classList.remove('legend-highlight'));

            if (!name) return;

            const escaped = name.replace(/"/g, '\\"');

            document.querySelectorAll(`.fill[data-window="${escaped}"]`).forEach(el => {
                el.classList.add('highlight');
            });

            const row = document.querySelector(`#legendTable tr[data-window="${escaped}"]`);
            if (row) {
                row.classList.add('legend-highlight');
                row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function showMinuteDetails(e, h, m) {
            const entry = data[`${h}-${m}`];
            if (!entry) return;

            let html = `Minute ${h}:${String(m).padStart(2, '0')}\nActive: ${entry.active}s\n\n`;
            for (const [win, sec] of Object.entries(entry.windows)) {
                html += `${sec}s - ${win.substring(0, 50)}\n`;
            }
            showTooltip(e, html);
        }

        function showHourSummary(e, h) {
            let totalActive = 0;
            const windowAgg = {};
            for (let m = 0; m < 60; m++) {
                const entry = data[`${h}-${m}`];
                if (entry) {
                    totalActive += entry.active;
                    for (const [win, sec] of Object.entries(entry.windows)) {
                        windowAgg[win] = (windowAgg[win] || 0) + sec;
                    }
                }
            }

            let html = `Hour ${h}:00 Summary\nTotal Active: ${Math.round(totalActive/60)}m\n\n`;
            Object.entries(windowAgg)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10)
                .forEach(([win, sec]) => {
                    html += `${Math.round(sec/60)}m - ${win.substring(0, 50)}\n`;
                });
            showTooltip(e, html);
        }

        function showTooltip(e, text) {
            tooltip.textContent = text;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 15) + 'px';
            tooltip.style.top = (e.clientY + 15) + 'px';
        }

        init();
    </script>
</body>
</html>
